# /etc/scratchpkg.conf - global options for scratchpkg (pkgbuild)
#
# Options documented in scratchpkg/README.md. Uncomment to override the
# built-in defaults; values below match scratchpkg's own defaults.

# SOURCE_DIR="/var/cache/scratchpkg/sources"
# PACKAGE_DIR="/var/cache/scratchpkg/packages"
# WORK_DIR="/var/cache/scratchpkg/work"
# CURL_OPTS=""
# COMPRESSION_MODE="xz"
# NO_STRIP="no"
# IGNORE_CHECKSUM="no"
# KEEP_LIBTOOL="no"
# KEEP_LOCALE="no"
# KEEP_DOC="no"
# NOCOLOR="no"

# ---------------------------------------------------------------------------
# Port trees shipped with lfs-scripts
#
# Every tree below lives under ports/ in this repository and is installed to
# /usr/ports/. Repositories cloned from upstream are converted to scratchpkg's
# spkgbuild format; the trees are listed in etc/scratchpkg.repo as well, which
# is the file scratchpkg's portsync reads.
#
#   tree                upstream
#   ----                --------
#   ports/core          Linux From Scratch 13.1 port set (SysV init, eudev)
#   ports/extra         lfs-scripts extra ports
#   ports/contrib       lfs-scripts contrib ports
#   ports/multilib      lfs-scripts 32-bit multilib ports
#   ports/opt           optional ports, including chromium-bin
#
# tools/sync-venom-ports.sh converts the venomlinux collections and imports them
# into these trees: core, extra and multilib into the matching tree, the rest
# into their own tree.
#
#   ports/nonfree       venomlinux nonfree collection
#   ports/mate          venomlinux mate collection
#   ports/xfce          venomlinux xfce collection
#   ports/kde-lxqt      venomlinux kde-lxqt collection
#   ports/s6            venomlinux s6 collection
