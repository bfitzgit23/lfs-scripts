###
### /etc/prt-get.conf - prt-get configuration for lfs-scripts
###
### Ports are searched in the order the prtdir lines appear, so the first tree
### that provides a port wins. Each name exists in exactly one tree: duplicates
### between trees are pruned (see ports/PRUNED-PORTS.txt).
###
### Order: the distribution's own ports first, then the venomlinux trees
### converted from spkgbuild, then the remaining imported trees.
###

# --- lfs-scripts own ports (pkgutils tree format, LFS 13.1 / SysV) ---
prtdir /usr/ports/core
prtdir /usr/ports/extra
prtdir /usr/ports/contrib
prtdir /usr/ports/multilib
prtdir /usr/ports/opt

# --- venomlinux trees, converted to Pkgfile by tools/sync-venom-ports.sh ---
prtdir /usr/ports/scratch/venom-core
prtdir /usr/ports/scratch/venom-extra
prtdir /usr/ports/scratch/venom-nonfree
prtdir /usr/ports/scratch/venom-multilib
prtdir /usr/ports/scratch/venom-kde-lxqt
prtdir /usr/ports/scratch/venom-mate
prtdir /usr/ports/scratch/venom-xfce
prtdir /usr/ports/scratch/venom-s6

# --- imported trees converted from scratchpkg (stormfs port set) ---
prtdir /usr/ports/scratch/compat-32
prtdir /usr/ports/scratch/gnome
prtdir /usr/ports/scratch/xorg
prtdir /usr/ports/scratch/plasma
prtdir /usr/ports/scratch/core
prtdir /usr/ports/scratch/xfce
prtdir /usr/ports/scratch/lxqt
prtdir /usr/ports/scratch/kde4
prtdir /usr/ports/scratch/compiz
prtdir /usr/ports/scratch/contrib
prtdir /usr/ports/scratch/iso

# --- build settings ---
# writefile logfile /var/log/pkgbuild/%n.log
# logfile /var/log/prt-get.log
# cachefile /var/cache/prt-get/cache.db
# makecommand make
# addcommand /usr/bin/pkgadd
# rmcommand /usr/bin/pkgrm
# runscripts yes
