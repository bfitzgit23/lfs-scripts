###
### /etc/prt-get.conf - prt-get configuration for lfs-scripts
###
### Ports are searched in the order the prtdir lines appear, so the first tree
### that provides a port wins. Each name exists in exactly one tree: duplicates
### between trees are pruned (see ports/PRUNED-PORTS.txt).
###
### Order: the distribution's own trees first (they now also hold the imported
### venomlinux recipes), then the remaining converted collections, then the
### venomlinux upstream trees synced by `ports -u`, then the stormfs
### collections. A local copy always wins over the same name upstream.
###

# --- lfs-scripts own ports (pkgutils tree format, LFS 13.1 / SysV) ---
prtdir /usr/ports/core
prtdir /usr/ports/extra
prtdir /usr/ports/contrib
prtdir /usr/ports/multilib
prtdir /usr/ports/opt

# --- further venomlinux collections, converted to Pkgfile and imported by
# --- tools/sync-venom-ports.sh (core, extra and multilib go into the trees
# --- above) ---
prtdir /usr/ports/nonfree
prtdir /usr/ports/mate
prtdir /usr/ports/xfce
prtdir /usr/ports/kde-lxqt
prtdir /usr/ports/s6

# --- venomlinux upstream trees, synchronised by `ports -u` through the .git
# --- collections in /etc/ports; the git driver converts each spkgbuild to a
# --- Pkgfile on the way in, which is what prt-get reads ---
prtdir /usr/ports/venom-core
prtdir /usr/ports/venom-extra
prtdir /usr/ports/venom-nonfree
prtdir /usr/ports/venom-multilib
prtdir /usr/ports/venom-kde-lxqt
prtdir /usr/ports/venom-mate
prtdir /usr/ports/venom-xfce
prtdir /usr/ports/venom-s6

# --- stormfs collections converted from scratchpkg (spkgbuild) form; the
# --- recipes that named core, contrib and xfce live in those trees above ---
prtdir /usr/ports/compat-32
prtdir /usr/ports/compiz
prtdir /usr/ports/gnome
prtdir /usr/ports/iso
prtdir /usr/ports/kde4
prtdir /usr/ports/lxqt
prtdir /usr/ports/plasma
prtdir /usr/ports/xorg

# --- build settings ---
# writefile logfile /var/log/pkgbuild/%n.log
# logfile /var/log/prt-get.log
# cachefile /var/cache/prt-get/cache.db
# makecommand make
# addcommand /usr/bin/pkgadd
# rmcommand /usr/bin/pkgrm
# runscripts yes
